
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>SoloDiary</title>

    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('solo_diary_theme');
          var isDark = savedTheme ? savedTheme === 'dark' : true;
          var root = document.documentElement;

          if (isDark) {
            root.classList.add('dark');
          } else {
            root.classList.remove('dark');
          }

          root.style.colorScheme = isDark ? 'dark' : 'light';
        } catch (e) {
          // Keep app boot resilient if storage is blocked.
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
    <link rel="icon" href="/assets/icons/solodiary_mine_icon_32x32.png" type="image/x-icon">
</head>
  <body class="bg-gray-50 dark:bg-slate-950">
    <div id="root">
      <!-- Inline loading spinner to avoid black screen while JS loads -->
      <div id="initial-loader" style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:inherit">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation:spin 1s linear infinite;color:#3b82f6">
          <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
        </svg>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
